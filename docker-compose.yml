services:
  postgres:
    image: postgres:16-alpine
    container_name: vidcorpus-postgres
    environment:
      POSTGRES_USER: vidcorpus
      POSTGRES_PASSWORD: vidcorpus
      POSTGRES_DB: vidcorpus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidcorpus -d vidcorpus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
